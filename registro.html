<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de ingreso</title>
<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#1d2a2c;--mut:#5d6b6e;--pri:#0b6b74;--ok:#1e8a4c;--bad:#c62828;--warn:#b26a00;--line:#d7e0e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.top{color:var(--pri);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:24px;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font-size:18px;padding:13px 12px;border:1.5px solid var(--line);border-radius:10px}
input:focus{outline:none;border-color:var(--pri)}
.hint{color:var(--mut);font-size:14px;margin:6px 0 14px}
button{width:100%;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
button.sec{background:#e6eeee;color:var(--ink);margin-top:10px}
.res{border-radius:14px;padding:22px 18px;color:#fff;text-align:center}
.res .ic{font-size:54px;line-height:1}
.res h2{margin:8px 0 6px;font-size:24px}
.res p{margin:4px 0}
.ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:var(--warn)}
.sel{width:100%;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.card label{margin-top:12px}.card label:first-child{margin-top:0}
.opt{margin-top:10px;background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.muted{color:var(--mut);font-size:14px;text-align:center;margin-top:16px}
.prog{margin-top:14px}
.prog h3{margin:0 0 2px;font-size:19px;color:var(--pri)}
.prog .meta{color:var(--mut);font-size:14px;margin:0 0 10px}
.prog ol{list-style:none;padding:0;margin:0}
.prog li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prog li:first-child{border-top:0}
.prog .h{flex:none;width:96px;white-space:nowrap;font-size:14px;font-weight:800;color:var(--pri);padding-top:2px}
.prog .a{font-weight:600}
.prog .l{color:var(--mut);font-size:14px}
.tip{background:#e6f1f2;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
#bv{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;color:#fff;
  background:radial-gradient(circle at 30% 20%,#14919b 0%,#0b6b74 55%,#06474d 100%);transition:opacity .6s}
#bv.fuera{opacity:0;pointer-events:none}
#bv>*{opacity:0;transform:translateY(14px);animation:sube .8s forwards}
#bv .hola{font-size:34px;font-weight:800;line-height:1.15;margin:0 0 14px;animation-delay:.2s}
#bv .que{font-size:21px;line-height:1.35;margin:0 0 16px;animation-delay:1s}
#bv .que:nth-child(2){animation-delay:.6s}
#bv .lema{font-size:19px;font-style:italic;margin:0 0 22px;color:#d9f3f5;animation-delay:2s}
#bv .fac{font-size:14px;letter-spacing:.05em;text-transform:uppercase;opacity:.9;animation-delay:2.8s}
#bv .pb{position:absolute;left:24px;right:24px;bottom:28px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;opacity:1;transform:none;animation:none}
#bv .pb i{display:block;height:100%;width:0;background:#fff;animation:llena 6.5s linear forwards}
@keyframes sube{to{opacity:1;transform:none}}
@keyframes llena{to{width:100%}}
</style>
</head>
<body>
<main>
  <div class="top">Jornada de Cierre de Vinculación con el Medio · UST</div>
  <h1 id="tit">Registro de ingreso</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="box"></div>
  <p class="muted">Si tienes problemas, acércate a la persona encargada de la entrada.</p>
</main>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1));
  var D=h.get('d')||'',J=h.get('j')||'',T=h.get('t')||'',SUP=h.get('s')||'',PASE='',box=document.getElementById('box');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function call(p){var u='https://script.google.com/macros/s/'+encodeURIComponent(D)+'/exec?'+new URLSearchParams(p);
    return fetch(u,{redirect:'follow'}).then(function(r){return r.json()})}
  function res(cls,ic,tit,lines,btn){box.innerHTML='';var r=el('div','res '+cls);r.append(el('div','ic',ic),el('h2','',tit));
    (lines||[]).forEach(function(l){if(l)r.append(el('p','',l))});box.append(r);
    if(btn){var b=el('button','sec',btn[0]);b.onclick=btn[1];box.append(b)}}
  function expirado(){res('warn','⏱','El código QR expiró',['Vuelve a escanear el código QR de la entrada para registrar tu ingreso.'])}
  function form(pre){box.innerHTML='';var c=el('div','card'),f=el('form');
    var l=el('label','','Tu correo institucional');l.htmlFor='m';
    var i=el('input');i.id='m';i.type='text';i.autocomplete='email';i.inputMode='email';i.autocapitalize='none';i.spellcheck=false;i.setAttribute('autocorrect','off');i.placeholder='n.apellido12@alumnos.santotomas.cl';i.required=true;i.value=pre||'';
    var hi=el('p','hint','Sirve @alumnos.santotomas.cl o @santotomas.cl. También puedes escribir solo la parte antes de la @ (por ejemplo: n.apellido12).');
    var b=el('button','','Registrar mi ingreso');b.type='submit';
    f.append(l,i,hi,b);c.append(f);box.append(c);
    f.onsubmit=function(ev){ev.preventDefault();var m=i.value.trim();if(!m)return;b.disabled=true;b.textContent='Registrando…';enviar(m)};
    setTimeout(function(){i.focus()},50)}
  function enviar(m,f){var p={a:'reg',j:J,s:SUP,pase:PASE,m:m};if(f)p.f=f;
    call(p).then(function(d){
      if(!d.ok){if(d.error==='qr')return expirado();
        if(d.error==='usado')return res('warn','✓','Este teléfono ya registró un ingreso',['Cada persona debe escanear el código QR de la entrada con su propio teléfono.']);
        if(d.error==='correo')return res('warn','✉','Correo no válido',['Revisa cómo lo escribiste.'],['Volver a intentar',function(){form(m)}]);
        return res('warn','!','No se pudo registrar',['Intenta nuevamente.'],['Volver a intentar',function(){form(m)}])}
      if(d.res==='ok'){res('ok','✓','Ingreso registrado',[d.nombre,d.carrera,'Hora: '+d.hora,'Muestra esta pantalla a la persona de la entrada.']);guardarPrograma(d);window.scrollTo(0,0);return bienvenida(d.nombre)}
      if(d.res==='ya'){res('ok','✓','Ya estabas registrado/a',[d.nombre,'Tu ingreso quedó registrado a las '+d.hora+'.']);return guardarPrograma(d)}
      if(d.res==='otra'){var ls=[d.nombre,'No estás inscrito/a en esta jornada.','Te corresponde:'];
        (d.asignadas||[]).forEach(function(a){ls.push(a.n+' · '+a.d)});
        if(d.yaVino)ls.push('Ya registraste tu asistencia en tu jornada a las '+d.yaVino+'.');
        return res('bad','✕','No corresponde esta jornada',ls)}
      if(d.res==='no'){res('warn','!','No estás inscrito/a',['"'+d.correo+'" no está en la nómina de esta jornada.','Si escribiste mal tu correo, corrígelo. Si no estás en la lista, deja tus datos.'],['Corregir mi correo',function(){form(m)}]);
        var b2=el('button','','No estoy en la lista: anotar mis datos');b2.style.marginTop='10px';b2.style.width='100%';b2.onclick=function(){formNo(d.correo)};box.append(b2);return}
      if(d.res==='elegir'){box.innerHTML='';var c=el('div','card');c.append(el('label','','Este correo está asociado a más de una persona. ¿Quién eres?'));
        d.opciones.forEach(function(o){var b=el('button','opt',o.n);b.onclick=function(){c.querySelectorAll('button').forEach(function(x){x.disabled=true});enviar(m,o.f)};c.append(b)});box.append(c);return}
    }).catch(function(){res('warn','!','Sin conexión',['Revisa tu internet e intenta nuevamente.'],['Volver a intentar',function(){form(m)}])})}
  function rutOk(r){var s=String(r||'').toUpperCase().replace(/[^0-9K]/g,'');if(s.length<8||s.length>9)return false;var c=s.slice(0,-1),dv=s.slice(-1),sum=0,mul=2;
    for(var i=c.length-1;i>=0;i--){sum+=Number(c[i])*mul;mul=mul===7?2:mul+1}var x=11-sum%11;return (x===11?'0':x===10?'K':String(x))===dv}
  function formNo(correo){box.innerHTML='';var c=el('div','card'),f=el('form');var err=el('p','hint');err.style.color='#c62828';err.style.fontWeight='600';
    function campo(id,txt,ph,v){var l=el('label','',txt);l.htmlFor=id;var i=el('input');i.id=id;i.placeholder=ph||'';i.value=v||'';i.required=true;f.append(l,i);return i}
    f.append(el('p','hint','Completa tus datos. Quedarán registrados para la organización de la jornada.'));
    var nom=campo('fn','Nombres','Ej: María José'),a1=campo('fa1','Apellido paterno'),a2=campo('fa2','Apellido materno'),rut=campo('fr','RUT','12345678-9'),mail=campo('fm','Correo',' ',correo);
    rut.inputMode='text';rut.autocapitalize='characters';mail.inputMode='email';mail.autocapitalize='none';
    var lc=el('label','','Carrera');lc.htmlFor='fc';var sc=el('select','sel');sc.id='fc';sc.required=true;
    ['','Enfermería','Kinesiología','Terapia Ocupacional','Tecnología Médica','Otra'].forEach(function(o){var op=el('option','',o||'Elige tu carrera');op.value=o;sc.append(op)});
    var otra=el('input');otra.placeholder='Escribe tu carrera';otra.style.display='none';otra.style.marginTop='8px';
    sc.onchange=function(){otra.style.display=sc.value==='Otra'?'block':'none';otra.required=sc.value==='Otra'};
    f.append(lc,sc,otra);var b=el('button','','Enviar mis datos');b.type='submit';b.style.marginTop='16px';f.append(err,b);c.append(f);box.append(c);
    f.onsubmit=function(ev){ev.preventDefault();err.textContent='';
      if(!rutOk(rut.value)){err.textContent='El RUT no es válido. Revisa el número y el dígito verificador.';rut.focus();return}
      var car=sc.value==='Otra'?otra.value.trim():sc.value;if(!car){err.textContent='Elige tu carrera.';return}
      b.disabled=true;b.textContent='Enviando…';
      call({a:'noins',j:J,s:SUP,pase:PASE,nom:nom.value,ap1:a1.value,ap2:a2.value,rut:rut.value,m:mail.value,car:car}).then(function(d){
        if(d.ok)return res('warn','✓','Tus datos quedaron registrados',[d.nombre,'No estás en la nómina de esta jornada.','Acércate a la persona encargada de la entrada.']);
        b.disabled=false;b.textContent='Enviar mis datos';
        err.textContent=d.error==='rut'?'El RUT no es válido.':d.error==='correo'?'Revisa tu correo.':d.error==='faltan'?'Completa todos los datos.':d.error==='qr'?'El código QR expiró: vuelve a escanear el QR de la entrada.':d.error==='usado'?'Desde este teléfono ya se enviaron datos.':'No se pudo enviar. Intenta de nuevo.'
      }).catch(function(){b.disabled=false;b.textContent='Enviar mis datos';err.textContent='Sin conexión. Intenta de nuevo.'})};
    setTimeout(function(){nom.focus()},50)}
  // ---- programa de la jornada ----
  // bienvenida: solo aparece cuando la persona fue ACEPTADA en la entrada (6,5 segundos) y luego se ve su programa
  function bienvenida(nombre){var v=document.createElement('div');v.id='bv';v.setAttribute('role','dialog');
    var hola=el('p','hola','¡Bienvenida y bienvenido!'),quien=el('p','que',String(nombre||'').split(' ')[0]);quien.style.fontWeight='700';quien.style.fontSize='26px';
    var que=el('p','que');que.innerHTML='a la Jornada de Cierre de<br><b>Vinculación con el Medio</b>';
    var lema=el('p','lema');lema.innerHTML='“Del aula a la comunidad:<br>un viaje para la salud”';
    var pb=el('div','pb');pb.append(el('i'));v.append(hola,quien,que,lema,el('p','fac','Facultad de Salud · UST Valdivia'),pb);
    if(!nombre)quien.remove();document.body.append(v);
    setTimeout(function(){v.classList.add('fuera');setTimeout(function(){v.remove()},650)},6500)}
  function KEY(j){return 'prog:'+D+':'+j}
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function lsPut(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function linkProg(){return location.pathname+'#d='+encodeURIComponent(D)+'&j='+J+'&prog=1'}
  function pintarPrograma(p,dest){var c=el('div','card prog');c.append(el('h3','','Programa · '+p.jornada.n),el('p','meta',p.jornada.d+' · '+p.lugar));
    if(p.nombre)c.insertBefore(el('p','meta','Participante: '+p.nombre),c.children[1].nextSibling);
    if(!p.programa||!p.programa.length)c.append(el('p','','El programa de esta jornada se publicará pronto. Vuelve a abrir esta página más tarde.'));
    else{var ol=el('ol');p.programa.forEach(function(x){var li=el('li'),w=el('div');w.append(el('div','a',x.a));var ex=[x.l,x.r].filter(Boolean).join(' · ');if(ex)w.append(el('div','l',ex));
      li.append(el('div','h',x.h||''),w);ol.append(li)});c.append(ol)}
    c.append(el('div','tip','📌 Para volver a ver el programa: abre de nuevo esta misma página (queda guardada en tu navegador) o escanea el QR de la entrada otra vez.'));
    dest.append(c)}
  function guardarPrograma(d){var p={nombre:d.nombre,jornada:d.jornada,lugar:d.lugar,programa:d.programa||[]};lsPut(KEY(J),p);lsPut('prog:ultimo:'+D,J);
    try{history.replaceState(null,'',linkProg())}catch(e){}pintarPrograma(p,box)}
  function verPrograma(j){J=j;var g=lsGet(KEY(j));document.getElementById('sub').textContent='';box.innerHTML='';
    if(g){document.getElementById('tit').textContent='Tu programa';pintarPrograma(g,box)}else box.append(el('p','sub','Cargando programa…'));
    call({a:'programa',j:j}).then(function(d){if(!d.ok)return;var p={nombre:g&&g.nombre,jornada:d.jornada,lugar:d.lugar,programa:d.programa};lsPut(KEY(j),p);
      document.getElementById('tit').textContent='Tu programa';box.innerHTML='';pintarPrograma(p,box)}).catch(function(){if(!g){box.innerHTML='';res('warn','!','Sin conexión',['No se pudo cargar el programa. Intenta más tarde.'])}})}
  if(h.get('prog')&&D&&J)return verPrograma(J);
  if(D&&!T){var ult=lsGet('prog:ultimo:'+D);if(ult)return verPrograma(ult)}
  if(!D||!J||!T){document.getElementById('sub').textContent='';return res('warn','!','Enlace incompleto',['Escanea el código QR de la entrada.'])}
  call({a:'abre',j:J,s:SUP,t:T}).then(function(d){
    if(!d.ok){document.getElementById('sub').textContent='';return expirado()}
    PASE=d.pase;document.getElementById('tit').textContent=d.jornada.n;
    document.getElementById('sub').textContent=d.jornada.d+' · '+d.lugar;
    history.replaceState(null,'',location.pathname+'#d='+encodeURIComponent(D)+'&j='+J+'&s='+encodeURIComponent(SUP));
    form('');
  }).catch(function(){document.getElementById('sub').textContent='';res('warn','!','Sin conexión',['Revisa tu internet y vuelve a escanear el código QR.'])});
})();
</script>
</body>
</html>
